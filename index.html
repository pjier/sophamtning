<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Soptunnepåminnelse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEF1E9;
    --paper-2: #E2E7DA;
    --ink: #1F2A22;
    --ink-soft: #55604F;
    --line: #C9D2BE;
    --bin-body: #232B24;
    --shadow: rgba(31,42,34,0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1B211B;
      --paper-2: #232B22;
      --ink: #EDF1E7;
      --ink-soft: #A9B39F;
      --line: #37402F;
      --bin-body: #10140F;
      --shadow: rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --paper: #1B211B;
    --paper-2: #232B22;
    --ink: #EDF1E7;
    --ink-soft: #A9B39F;
    --line: #37402F;
    --bin-body: #10140F;
    --shadow: rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.6s ease;
  }
  h1, h2, .display {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    margin: 0;
  }
  #app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .datestrip {
    padding: 20px 28px 0;
    font-size: 15px;
    color: var(--ink-soft);
    letter-spacing: 0.01em;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .calm {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    text-align: center;
  }
  .calm .display { font-size: clamp(28px, 4vw, 40px); }
  .calm .sub { color: var(--ink-soft); font-size: 17px; max-width: 34ch; }
  .calm-icon { width: 110px; height: 110px; }

  .link-btn {
    border: none;
    background: none;
    color: var(--ink-soft);
    font-family: 'Work Sans', sans-serif;
    font-size: 14px;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 6px;
  }
  .link-btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  .alerts {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .card {
    border-radius: 28px;
    overflow: hidden;
    background: var(--paper-2);
    box-shadow: 0 14px 32px var(--shadow);
  }
  .card-bar { height: 12px; width: 100%; }
  .card-body {
    padding: 24px 30px 28px;
    display: grid;
    grid-template-columns: 130px 1fr;
    gap: 26px;
    align-items: center;
  }
  .card .bin-illustration { width: 100%; height: auto; }
  .headline-row { display: flex; align-items: center; gap: 10px; }
  .warn-badge { width: 26px; height: 26px; flex-shrink: 0; }
  .card .display { font-size: clamp(22px, 3.2vw, 30px); line-height: 1.15; }
  .card .meta { font-size: 15px; margin-top: 6px; opacity: 0.85; }
  .card .actions { display: flex; align-items: center; gap: 16px; margin-top: 16px; flex-wrap: wrap; }
  .card button.confirm {
    border: none;
    border-radius: 999px;
    padding: 14px 26px;
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    background: var(--ink);
    color: var(--paper);
    transition: transform 0.15s ease;
  }
  .card button.confirm:active { transform: scale(0.97); }
  .card button.confirm:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .done-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 6px;
  }
  .done-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 15px;
  }
  .done-row .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .done-row .undo {
    border: none;
    background: none;
    color: var(--ink-soft);
    font-family: 'Work Sans', sans-serif;
    font-size: 14px;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
    padding: 4px;
  }

  .footer {
    padding: 20px 28px 26px;
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
    justify-content: center;
    border-top: 1px solid var(--line);
  }
  .footer .bin {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .footer .dot {
    width: 12px; height: 12px; border-radius: 50%;
    flex-shrink: 0;
  }
  .footer .bin-name { font-size: 14px; font-weight: 500; }
  .footer .bin-next { font-size: 13px; color: var(--ink-soft); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  @media (max-width: 640px) {
    .card-body { grid-template-columns: 1fr; text-align: center; }
    .card .bin-illustration { width: 96px; margin: 0 auto; }
    .headline-row { justify-content: center; }
    .card .actions { justify-content: center; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="datestrip">
    <span id="datestrip"></span>
    <span id="weekstrip"></span>
  </div>
  <div class="stage" id="stage"></div>
  <div class="footer" id="footer"></div>
</div>

<script>
/* ============================================================
   REDIGERA HÄR — er egen sophämtning.
   colorA/colorB = handtagsfärgerna (hex, används för kortets
   topplist och illustrationen — identifiering, inte larmfärg).
   Om en sida är svart/omärkt, sätt bgMode till 'solid'.
   referenceDate = ETT verkligt hämtningsdatum (ÅÅÅÅ-MM-DD) för
   just det kärlet — appen räknar ut alla framtida datum från det.
   ============================================================ */
const CONFIG = {
  bins: [
    { id: 'karl1', number: 1, handleDesc: 'grönt handtag',
      colorA: '#43A047', colorB: '#2B2F2C', bgMode: 'solid',
      cadenceWeeks: 2, referenceDate: '2026-09-24' },
    { id: 'karl2', number: 2, handleDesc: 'senapsgult och lila handtag',
      colorA: '#C99A3B', colorB: '#A83E8C', bgMode: 'gradient',
      cadenceWeeks: 2, referenceDate: '2026-09-21' },
    { id: 'karl3', number: 3, handleDesc: 'ljusblått och vitt handtag',
      colorA: '#4FC3D9', colorB: '#FFFFFF', bgMode: 'gradient',
      cadenceWeeks: 4, referenceDate: '2026-09-28' },
  ]
};
/* ============================================================ */

const MS_DAY = 86400000;
const YELLOW = '#F2C230';
const RED = '#D93636';
const RED_AT_HOURS = 21;   // helt röd efter 21 timmar in i fönstret
const WEEKDAYS = ['söndag','måndag','tisdag','onsdag','torsdag','fredag','lördag'];
const MONTHS = ['januari','februari','mars','april','maj','juni','juli','augusti','september','oktober','november','december'];

let previewOn = false;

function startOfDay(d) {
  const x = new Date(d);
  x.setHours(0,0,0,0);
  return x;
}
function daysBetween(a, b) {
  return Math.round((startOfDay(b) - startOfDay(a)) / MS_DAY);
}
function isoDate(d) { return startOfDay(d).toISOString().slice(0,10); }

function isoWeekNumber(d) {
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = date.getUTCDay() || 7;
  date.setUTCDate(date.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
  return Math.ceil((((date - yearStart) / MS_DAY) + 1) / 7);
}

function isDueOnDate(bin, dateStart) {
  const ref = startOfDay(new Date(bin.referenceDate + 'T00:00:00'));
  const diff = daysBetween(ref, dateStart);
  const period = bin.cadenceWeeks * 7;
  return diff >= 0 && diff % period === 0;
}

function nextDueDate(bin, today) {
  const ref = startOfDay(new Date(bin.referenceDate + 'T00:00:00'));
  const period = bin.cadenceWeeks * 7;
  let diff = daysBetween(ref, today);
  if (diff < 0) return ref;
  const rem = diff % period;
  const add = rem === 0 ? 0 : period - rem;
  const next = new Date(today);
  next.setDate(next.getDate() + add);
  return next;
}

/* Tillstånd 1 = "tunna ska dras fram": 36 timmar, från midnatt dagen
   innan hämtning till kl 12 hämtningsdagen. */
function binWindowState(bin, now) {
  const todayStart = startOfDay(now);
  const yestStart = new Date(todayStart); yestStart.setDate(yestStart.getDate() - 1);
  const tomorrowStart = new Date(todayStart); tomorrowStart.setDate(tomorrowStart.getDate() + 1);

  if (isDueOnDate(bin, todayStart) && now.getHours() < 12) {
    // andra halvan av fönstret: hämtningsdagens morgon, före kl 12
    const elapsedHours = (now - yestStart) / 3600000;
    return { inWindow: true, elapsedHours, dueDateIso: isoDate(todayStart) };
  }
  if (isDueOnDate(bin, tomorrowStart)) {
    // första halvan av fönstret: dagen innan, från midnatt
    const elapsedHours = (now - todayStart) / 3600000;
    return { inWindow: true, elapsedHours, dueDateIso: isoDate(tomorrowStart) };
  }
  return { inWindow: false };
}

function confirmedFor(binId) { return localStorage.getItem('soptunna_confirmed_' + binId); }
function setConfirmed(binId, dateIso) { localStorage.setItem('soptunna_confirmed_' + binId, dateIso); }
function clearConfirmed(binId) { localStorage.removeItem('soptunna_confirmed_' + binId); }

function hexToRgb(hex) {
  const h = hex.replace('#', '');
  return { r: parseInt(h.substring(0,2),16), g: parseInt(h.substring(2,4),16), b: parseInt(h.substring(4,6),16) };
}
function mixHex(hexA, hexB, t) {
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  const r = Math.round(a.r + (b.r - a.r) * t);
  const g = Math.round(a.g + (b.g - a.g) * t);
  const bl = Math.round(a.b + (b.b - a.b) * t);
  return '#' + [r,g,bl].map(v => v.toString(16).padStart(2,'0')).join('');
}
function alertColorForProgress(elapsedHours) {
  const t = Math.max(0, Math.min(1, elapsedHours / RED_AT_HOURS));
  return mixHex(YELLOW, RED, t);
}

function bgFor(bin, alpha) {
  if (bin.bgMode === 'gradient') {
    return `linear-gradient(135deg, ${bin.colorA}${alpha}, ${bin.colorB}${alpha})`;
  }
  return `${bin.colorA}${alpha}`;
}

function binIcon(bin) {
  return `
  <svg class="bin-illustration" viewBox="0 0 140 180" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="22" y="52" width="96" height="112" rx="16" fill="var(--bin-body)"/>
    <rect x="14" y="36" width="112" height="24" rx="12" fill="var(--bin-body)"/>
    <path d="M52 20 C52 12 60 8 70 8 L70 36 L52 36 Z" fill="${bin.colorA}" stroke="var(--line)" stroke-width="1"/>
    <path d="M70 8 C80 8 88 12 88 20 L88 36 L70 36 Z" fill="${bin.colorB}" stroke="var(--line)" stroke-width="1"/>
    <rect x="50" y="42" width="18" height="9" rx="4.5" fill="${bin.colorA}" stroke="var(--line)" stroke-width="1"/>
    <rect x="72" y="42" width="18" height="9" rx="4.5" fill="${bin.colorB}" stroke="var(--line)" stroke-width="1"/>
    <rect x="34" y="76" width="72" height="6" rx="3" fill="rgba(255,255,255,0.14)"/>
    <rect x="34" y="92" width="72" height="6" rx="3" fill="rgba(255,255,255,0.14)"/>
    <text x="70" y="136" text-anchor="middle" font-family="Work Sans, sans-serif" font-weight="600" font-size="22" fill="rgba(255,255,255,0.35)">${bin.number}</text>
    <circle cx="40" cy="168" r="9" fill="var(--bin-body)"/>
    <circle cx="100" cy="168" r="9" fill="var(--bin-body)"/>
  </svg>`;
}
function calmIcon() {
  return `
  <svg class="calm-icon" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="70" cy="70" r="66" fill="var(--paper-2)"/>
    <path d="M46 72 L63 90 L96 52" stroke="var(--ink)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>`;
}
function warningBadge() {
  return `
  <svg class="warn-badge" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="16" cy="16" r="14.5" fill="none" stroke="var(--ink)" stroke-width="2.4"/>
    <rect x="14.4" y="8" width="3.2" height="11" rx="1.6" fill="var(--ink)"/>
    <circle cx="16" cy="23" r="1.8" fill="var(--ink)"/>
  </svg>`;
}

function alertCardHtml(bin, { isPreview, dueDateIso } = {}) {
  const actionHtml = isPreview
    ? `<button class="confirm" id="closePreview">Stäng exempel</button>`
    : `<button class="confirm" data-bin="${bin.id}" data-due="${dueDateIso}">Klart</button>`;
  return `
    <div class="card">
      <div class="card-bar" style="background:${bgFor(bin, '')};"></div>
      <div class="card-body">
        ${binIcon(bin)}
        <div>
          <div class="headline-row">
            ${warningBadge()}
            <h2 class="display">Dra ut kärl ${bin.number}</h2>
          </div>
          <div class="meta">${isPreview ? 'Exempel: så här ser en påminnelse ut' : 'Hämtning imorgon'}</div>
          <div class="actions">${actionHtml}</div>
        </div>
      </div>
    </div>`;
}

function render() {
  const now = new Date();

  document.getElementById('datestrip').textContent =
    `${WEEKDAYS[now.getDay()]} ${now.getDate()} ${MONTHS[now.getMonth()]}`;
  document.getElementById('weekstrip').textContent = `vecka ${isoWeekNumber(now)}`;

  const stage = document.getElementById('stage');
  const body = document.body;

  if (previewOn) {
    body.style.background = alertColorForProgress(6) + '73';
    stage.innerHTML = `<div class="alerts">${alertCardHtml(CONFIG.bins[1], { isPreview: true })}</div>`;
    document.getElementById('closePreview').addEventListener('click', () => {
      previewOn = false;
      render();
    });
    document.getElementById('footer').innerHTML = '';
    return;
  }

  const states = CONFIG.bins.map(bin => {
    const w = binWindowState(bin, now);
    if (!w.inWindow) return { bin, inWindow: false };
    const confirmed = confirmedFor(bin.id) === w.dueDateIso;
    return { bin, inWindow: true, dueDateIso: w.dueDateIso, elapsedHours: w.elapsedHours, confirmed };
  });

  const active = states.filter(s => s.inWindow && !s.confirmed);
  const done = states.filter(s => s.inWindow && s.confirmed);

  if (active.length > 0) {
    const maxProgress = Math.max(...active.map(s => s.elapsedHours));
    body.style.background = alertColorForProgress(maxProgress) + '73';
    const doneHtml = done.length > 0 ? `
      <div class="done-list">
        ${done.map(s => `
          <div class="done-row">
            <span class="dot" style="background:${s.bin.colorA}"></span>
            <span>Kärl ${s.bin.number} klart</span>
            <button class="undo" data-undo="${s.bin.id}">Ångra</button>
          </div>`).join('')}
      </div>` : '';
    stage.innerHTML = `<div class="alerts">
      ${active.map(s => alertCardHtml(s.bin, { dueDateIso: s.dueDateIso })).join('')}
      ${doneHtml}
    </div>`;
    stage.querySelectorAll('button[data-bin]').forEach(btn => {
      btn.addEventListener('click', () => {
        setConfirmed(btn.dataset.bin, btn.dataset.due);
        render();
      });
    });
    stage.querySelectorAll('button[data-undo]').forEach(btn => {
      btn.addEventListener('click', () => {
        clearConfirmed(btn.dataset.undo);
        render();
      });
    });
  } else if (done.length > 0) {
    body.style.background = 'var(--paper)';
    stage.innerHTML = `
      <div class="calm">
        ${calmIcon()}
        <h1 class="display">Allt klart</h1>
        <div class="sub">Bra jobbat — klart inför morgondagens hämtning.</div>
        <div class="done-list">
          ${done.map(s => `
            <div class="done-row">
              <span class="dot" style="background:${s.bin.colorA}"></span>
              <span>Kärl ${s.bin.number}</span>
              <button class="undo" data-undo="${s.bin.id}">Ångra</button>
            </div>`).join('')}
        </div>
      </div>`;
    stage.querySelectorAll('button[data-undo]').forEach(btn => {
      btn.addEventListener('click', () => {
        clearConfirmed(btn.dataset.undo);
        render();
      });
    });
  } else {
    body.style.background = 'var(--paper)';
    stage.innerHTML = `
      <div class="calm">
        ${calmIcon()}
        <h1 class="display">Allt klart</h1>
        <div class="sub">Inga soptunnor behöver dras ut.</div>
        <button class="link-btn" id="showPreview">Visa hur en påminnelse ser ut</button>
      </div>`;
    document.getElementById('showPreview').addEventListener('click', () => {
      previewOn = true;
      render();
    });
  }

  const today = startOfDay(now);
  document.getElementById('footer').innerHTML = CONFIG.bins.map(b => {
    const next = nextDueDate(b, today);
    const label = daysBetween(today, next) === 0 ? 'idag' : `${WEEKDAYS[next.getDay()]} ${next.getDate()}/${next.getMonth()+1}`;
    return `<div class="bin">
      <span class="dot" style="background:${b.colorA}"></span>
      <div>
        <div class="bin-name">Kärl ${b.number}</div>
        <div class="bin-next">${label}</div>
      </div>
    </div>`;
  }).join('');
}

render();
setInterval(render, 60000);
</script>
</body>
</html>
